const cards=[...document.querySelectorAll('.card')];const count=document.getElementById('count');function update(){let n=cards.filter(c=>!c.classList.contains('flipped')).length;count.textContent=n+' suspeito'+(n===1?'':'s')+' restante'+(n===1?'':'s')}
cards.forEach((c,i)=>c.addEventListener('click',()=>{let flipped=c.classList.toggle('flipped');c.setAttribute('aria-pressed',String(flipped));c.setAttribute('aria-label',(flipped?'Revelar':'Virar')+' personagem '+(i+1));update()}));document.getElementById('reset').addEventListener('click',()=>{cards.forEach((c,i)=>{c.classList.remove('flipped');c.setAttribute('aria-pressed','false');c.setAttribute('aria-label','Virar personagem '+(i+1))});update()});
